<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2c0e0a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='10' width='44' height='44' rx='5' transform='rotate(45 32 32)' fill='%236d1d15' stroke='%23e0ad52' stroke-width='3'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='28' fill='%23ffe0a0'%3E%E5%BD%B1%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="以浏览器手势识别实时操纵传统皮影角色的互动戏台。摄像头画面仅在设备端处理。" />
    <title>掌上皮影 · 实时手势戏台</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="skip">跳到戏台</a>
    <div id="experience" class="experience" data-state="landing" data-curtain="closed" data-mode="camera">
      <div class="paper-grain" aria-hidden="true"></div>
      <header class="topbar">
        <button id="homeButton" class="brand" type="button" data-i18n-aria="home" aria-label="回到首页">
          <span class="brand-seal" aria-hidden="true"><i>影</i></span>
          <span class="brand-copy"><strong data-i18n="title">掌上皮影</strong><small>GESTURE SHADOW PLAY</small></span>
        </button>
        <div id="status" class="status" role="status" aria-live="polite">
          <span id="statusDot" class="status-dot" aria-hidden="true"></span>
          <span id="statusText" data-i18n="landingStatus">尚未入场</span>
        </div>
        <div class="top-actions">
          <button id="soundButton" class="icon-button" type="button" aria-pressed="true" data-i18n-aria="soundOn"><span id="soundIcon" aria-hidden="true">声</span></button>
          <button id="debugButton" class="icon-button" type="button" aria-pressed="false" data-i18n-aria="debug"><span aria-hidden="true">瞳</span></button>
          <button id="knowledgeButton" class="icon-button" type="button" data-i18n-aria="knowledge"><span aria-hidden="true">志</span></button>
        </div>
      </header>
      <main id="main-content" class="main-content">
        <nav class="role-selector" aria-label="角色" data-i18n-aria="roleLabel">
          <span class="role-lead" data-i18n="chooseRole">选角</span>
          <button class="role-button is-active" type="button" data-role="sheng" aria-pressed="true"><span data-i18n="sheng">生角</span><small>SHENG</small></button>
          <button class="role-button" type="button" data-role="dan" aria-pressed="false"><span data-i18n="dan">旦角</span><small>DAN</small></button>
          <button class="role-button" type="button" data-role="jing" aria-pressed="false"><span data-i18n="jing">净角</span><small>JING</small></button>
        </nav>
        <section class="theatre" aria-label="互动皮影戏台" data-i18n-aria="stageLabel">
          <div class="theatre-light" aria-hidden="true"></div>
          <div id="gongFlash" class="gong-flash" aria-hidden="true"></div>
          <canvas id="puppetCanvas" class="puppet-canvas" data-i18n-aria="puppet" aria-label="皮影角色"></canvas>
          <div class="curtain curtain-left" aria-hidden="true"><div class="curtain-folds"></div><span class="curtain-knot">吉</span></div>
          <div class="curtain curtain-right" aria-hidden="true"><div class="curtain-folds"></div><span class="curtain-knot">祥</span></div>
          <div class="proscenium" aria-hidden="true"><span class="proscenium-top"></span><span class="proscenium-left"></span><span class="proscenium-right"></span><span class="proscenium-bottom"></span></div>
          <div id="gestureCue" class="gesture-cue">
            <span id="cueGlyph" class="cue-glyph" aria-hidden="true">拳</span>
            <span class="cue-copy"><strong id="cueTitle" data-i18n="makeFist">握拳开幕</strong><small id="cueDetail" data-i18n="fistDetail">保持片刻，锣响入戏</small></span>
            <span class="cue-progress" aria-hidden="true"><i id="cueProgress"></i></span>
          </div>
          <div id="cameraPreview" class="camera-preview" hidden>
            <div class="diagnostic-heading"><strong data-i18n="controlInspector">控制检查器</strong><button id="mirrorButton" class="diagnostic-toggle" type="button" aria-pressed="true" data-i18n="mirrorView">镜像画面</button></div>
            <div class="camera-view"><video id="cameraVideo" autoplay muted playsinline></video><canvas id="debugCanvas"></canvas></div>
            <div class="diagnostic-controls">
              <label><span data-i18n="showControl">显示控制</span><select id="debugHandSelect"><option value="all" data-i18n="showAll">双手与身体</option><option value="left" data-i18n="showLeft">左臂</option><option value="right" data-i18n="showRight">右臂</option></select></label>
              <label><span data-i18n="armMapping">手臂映射</span><select id="controlSideSelect"><option value="natural" data-i18n="naturalMapping">自动</option><option value="swapped" data-i18n="swappedMapping">交换左右</option></select></label>
            </div>
            <div class="camera-caption"><span data-i18n="workerVision">后台识别</span><span><b id="renderRate">0</b> UI FPS · <b id="inferenceRate">0</b> AI FPS · <b id="inferenceLatency">0</b> ms</span></div>
            <div id="mappingSummary" class="mapping-summary" aria-live="polite" data-i18n="waitingHands">等待手部进入画面</div>
          </div>
          <div id="manualControls" class="manual-controls" hidden>
            <div class="manual-pad" data-pad="left"><button class="manual-handle" type="button" data-control="left" data-i18n-aria="leftRod">左</button><span data-i18n="leftRod">左手杆</span></div>
            <div class="manual-pad" data-pad="body"><button class="manual-handle" type="button" data-control="body" data-i18n-aria="bodyRod">身</button><span data-i18n="bodyRod">身体杆</span></div>
            <div class="manual-pad" data-pad="right"><button class="manual-handle" type="button" data-control="right" data-i18n-aria="rightRod">右</button><span data-i18n="rightRod">右手杆</span></div>
          </div>
        </section>
        <footer class="stage-footer">
          <div class="mode-copy"><span class="mode-mark" aria-hidden="true">◎</span><span id="privacyText" data-i18n="privacy">画面只在此设备处理，不会上传</span></div>
          <div class="footer-actions">
            <button id="retryButton" class="text-button" type="button" hidden data-i18n="retry">重试摄像头</button>
            <button id="modeButton" class="text-button" type="button" data-i18n="manualMode">切换手动</button>
            <div class="language-switcher" role="group" aria-label="Language"><button type="button" data-language="zh" aria-pressed="true">中</button><button type="button" data-language="en" aria-pressed="false">EN</button><button type="button" data-language="ms" aria-pressed="false">MS</button></div>
          </div>
        </footer>
        <section class="music-controls" data-i18n-aria="musicSettings" aria-label="配乐设置">
          <label class="music-track"><span data-i18n="musicLabel">配乐</span><select id="musicSelect"></select></label>
          <label class="music-volume"><span data-i18n="musicVolume">配乐音量</span><input id="musicVolume" type="range" min="0" max="100" step="1" value="28" /><output id="musicVolumeValue" for="musicVolume">28%</output></label>
          <button id="musicCreditsButton" class="music-credits-button" type="button" data-i18n="musicCredits">音乐来源与署名</button>
          <div class="cue-previews"><span data-i18n="curtainCues">幕布锣鼓</span><button id="previewOpeningCue" class="music-credits-button" type="button" data-i18n="previewOpeningCue">试听开幕</button><button id="previewClosingCue" class="music-credits-button" type="button" data-i18n="previewClosingCue">试听闭幕</button></div>
          <span id="musicStatus" class="music-status" role="status" hidden></span>
        </section>
      </main>
      <section id="landing" class="landing" aria-labelledby="landingTitle">
        <div class="landing-curtain" aria-hidden="true"><span>皮影</span></div>
        <div class="landing-panel">
          <span class="landing-eyebrow" data-i18n="heritage">华县牛皮影戏 · 数字体验</span>
          <h1 id="landingTitle" data-i18n="landingTitle">举手，唤醒一幕千年光影</h1>
          <p data-i18n="landingIntro">点击入场后允许使用摄像头。握拳开幕，双手操偶，交叉双手闭幕。</p>
          <div class="gesture-legend" aria-label="手势说明"><div><b>拳</b><span data-i18n="legendFist">握拳开幕</span></div><i aria-hidden="true"></i><div><b>掌</b><span data-i18n="legendMove">双手操偶</span></div><i aria-hidden="true"></i><div><b>叉</b><span data-i18n="legendCross">交叉闭幕</span></div></div>
          <button id="enterButton" class="enter-button" type="button"><span data-i18n="enter">点击入场</span><small data-i18n="enterNote">启用摄像头与声音</small></button>
          <button id="manualEntryButton" class="quiet-entry" type="button" data-i18n="enterManual">无摄像头，使用操杆</button>
        </div>
      </section>
    </div>
    <dialog id="knowledgeDialog" class="knowledge-dialog" aria-labelledby="knowledgeTitle">
      <div class="dialog-heading"><div><small data-i18n="archive">SHADOW PLAY ARCHIVE</small><h2 id="knowledgeTitle" data-i18n="knowledgeTitle">皮影小志</h2></div><button id="closeKnowledgeButton" class="icon-button" type="button" data-i18n-aria="close">合</button></div>
      <div id="knowledgeContent" class="knowledge-content"></div>
      <section class="music-credits"><h3 id="musicCreditsHeading" tabindex="-1" data-i18n="musicCredits">音乐来源与署名</h3><p data-i18n="musicContext">现代氛围配乐，用于数字体验，不是华县皮影传统唱腔录音。</p><div id="musicCreditsContent"></div></section>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
